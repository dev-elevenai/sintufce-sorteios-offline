[workspace]
members = ["crates/core", "crates/cli", "crates/verifier"]
exclude = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
chacha20 = "0.9"
csv = "1.3"
ed25519-dalek = { version = "2", features = ["zeroize"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
